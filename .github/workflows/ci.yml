name: CI

"on":
  push:
    branches: [main, hark-dev, manus]
  pull_request: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 本技术栈的标准命令。项目未配置的工具请删除对应步骤。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: bash scripts/check-branch-config.sh
      # 测试失败时把 not ok 段落写进运行摘要与注解（未登录也能在运行页看到），便于定位偶发失败
      - name: npm run test
        shell: bash
        run: |
          set +e
          npm run test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            fail=$(grep -n -E '^\s*not ok' -A30 test-output.txt | head -120)
            { echo '### 失败的测试'; echo '```'; echo "$fail"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=npm run test 失败::$(echo "$fail" | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit "$status"
      - run: npm run build
      - run: node scripts/web-smoke.ts

  # Electron E2E 核心路径（T040）：真实 Electron + 假 OpenAI 兼容服务器，xvfb 提供显示。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64 libxcomposite1 libxdamage1 libatk-bridge2.0-0
      - run: xvfb-run -a npm run test:e2e

  # Windows 实机验证 opencode 集成（T-021 / T124）：真实 npm 安装的 opencode，
  # 验 .cmd → .exe 解析、含空格 / 中文路径、taskkill 停止 serve 进程树，
  # 以及 platform-env 的 Git Bash 探测 / PowerShell 回退分支注入。
  # 脚本逐步记账，失败看日志中 ✗ 的项名即可定位。
  windows-opencode:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 版本与项目实测口径对齐（presets.ts / opencode-serve.ts 均按 1.19.3 实测），
      # 不浮动跟最新：升级 opencode 时先改此处并重跑本作业验证。
      - name: Install opencode (pinned 1.19.3)
        run: npm install -g opencode-ai@1.19.3
      - name: Show opencode shim layout
        run: where.exe opencode
      # 验证脚本只 import src 源码与 node 内置模块（类型擦除直接运行），不依赖仓库 node_modules，
      # 故本作业不跑 npm install；仓库自身的 lint / 类型 / 测试由 build-test 作业覆盖。
      - name: Verify opencode Windows integration (T-021)
        run: node scripts/verify-opencode-windows.ts
