# 泳道文件所有权。每行一个泳道：<泳道名> <glob> [<glob> ...]
# glob 为 bash 模式，* 可跨目录。仅 coordinator 可修改本文件。
# worker 分支 feat/<泳道>/<任务> 只能修改匹配本泳道的文件。
# 以 ! 开头的 glob 表示从本泳道排除。
contracts contracts/* docs/SPEC.md docs/architecture/* specs/* .specify/memory/*
frontend src/frontend/* tests/*/frontend/*
backend src/backend/* tests/*/backend/*
docs docs/* README.md CHANGELOG.md !docs/SPEC.md !docs/architecture/* !docs/tasks/* !docs/agents/* !docs/commands/* !docs/development/multi-agent.md
infra .github/* scripts/* .agents/* .gitignore .editorconfig .vscode/* .specify/* !.specify/memory/* .codex/* .claude/*

# 共享热点文件：不属于任何泳道，只能由 coordinator 在 int/* 分支上修改。
@shared AGENTS.md LICENSE package.json package-lock.json tsconfig.json
